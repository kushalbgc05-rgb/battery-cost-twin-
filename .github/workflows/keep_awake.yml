name: Keep Streamlit Awake (Browser Simulation)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Playwright Browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          
      - name: Visit Dashboards as Real User
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time
          
          urls = [
              'https://electric-mobility-h9z8tfzyc9tappwnuxqnvrt.streamlit.app/',
              'https://emobility-energy-pmo-twin-jhpcmqugzfuh89d9nekoay.streamlit.app/',
              'https://m5y35q4llz9jawbrp4gyuj.streamlit.app/'
          ]
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              for url in urls:
                  try:
                      print(f'Loading {url}...')
                      # networkidle ensures all JavaScript and WebSockets fully load
                      page.goto(url, wait_until='networkidle', timeout=60000)
                      time.sleep(10) # Stays on the page for 10 seconds to register activity
                      print('Successfully registered active visit.')
                  except Exception as e:
                      print(f'Timeout or error: {e}')
              browser.close()
          "
